name: macOS tests

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-tests.yml"]
  pull_request:
    branches: [main]
    paths: ["macos/**", ".github/workflows/macos-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift tests
        run: macos/scripts/test.sh
