name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", "macos/Backend/**", "LICENSE", ".github/workflows/windows-build.yml"]
  pull_request:
    branches: [main]
    paths: ["windows/**", "macos/Backend/**", "LICENSE", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check Windows x64 package
        shell: pwsh
        run: ./windows/scripts/build.ps1
      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: FoxyVPN-windows-x64
          path: |
            windows/dist/FoxyVPN-win-x64.zip
            windows/dist/FoxyVPN-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
